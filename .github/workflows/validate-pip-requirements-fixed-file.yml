# Fast lockfile validation (no pip-compile / pip install).
# Each pin: bdist_wheel on pypi.org and on Nordic nordic-pypi (marker-aware cp312 OS set).
# Markers: default linux+windows+mac_arm; win-only → windows; platform_system!=Linux → no linux wheel.
# Does not replace requirements-fixed.sh regen or bundler pip-audit.
# matter-idl, py-utlx: Nordic mirror only (not on public PyPI).
# Pins in scripts/requirements-validate-sdist-ok.txt: versioned sdist OK via HTTP JSON/simple — no pip.
# Failing only nordic-wheels → mirror sync / pip_requestor; only pypi-wheels → upstream wheels or pin change.
name: Validate pip requirements-fixed.txt

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - 'v*-branch'
    paths:
      - 'scripts/requirements-fixed.txt'
      - 'scripts/requirements*.txt'
      - 'scripts/validate_requirements_fixed_pins.py'
      - 'scripts/requirements-validate-sdist-ok.txt'
      - '.github/workflows/validate-pip-requirements-fixed-file.yml'

permissions:
  contents: read

env:
  VALIDATOR: scripts/validate_requirements_fixed_pins.py
  REQUIREMENTS: scripts/requirements-fixed.txt
  NORDIC_INDEX: https://files.nordicsemi.com/artifactory/api/pypi/nordic-pypi/simple

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Sanity check lockfile index header
        run: |
          set -euo pipefail
          grep -q 'files.nordicsemi.com/artifactory/api/pypi/nordic-pypi/simple' \
            "$REQUIREMENTS"

  pypi-wheels:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Get python version
        id: pyv
        run: |
          python_version=$(awk '/^python:/{getline; print $2; exit}' scripts/tools-versions-linux.yml)
          echo "python_version=$python_version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '${{ steps.pyv.outputs.python_version }}'

      - name: Verify PyPI wheels (shard ${{ matrix.shard }})
        run: |
          set -euo pipefail
          python3 "$VALIDATOR" \
            --requirements "$REQUIREMENTS" \
            --index pypi \
            --python-tag cp312 \
            --workers 20 \
            --shard-count 4 \
            --shard-id ${{ matrix.shard }}

  nordic-wheels:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Get python version
        id: pyv
        run: |
          python_version=$(awk '/^python:/{getline; print $2; exit}' scripts/tools-versions-linux.yml)
          echo "python_version=$python_version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '${{ steps.pyv.outputs.python_version }}'

      - name: Verify Nordic mirror wheels (shard ${{ matrix.shard }})
        run: |
          set -euo pipefail
          python3 "$VALIDATOR" \
            --requirements "$REQUIREMENTS" \
            --index nordic \
            --index-url "$NORDIC_INDEX" \
            --python-tag cp312 \
            --workers 20 \
            --shard-count 4 \
            --shard-id ${{ matrix.shard }}