# Verify each lock pin is published on pypi.org (sdist or wheel); matter-idl omitted at runtime.
name: Validate pip requirements-fixed.txt

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - 'v*-branch'
    paths:
      - 'scripts/requirements-fixed.txt'
      - 'scripts/requirements*.txt'
      - '.github/workflows/validate-pip-requirements-fixed-file.yml'

permissions:
  contents: read

jobs:
  test-install-pypi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Get python version
        id: pyv
        run: |
          python_version=$(awk '/^python:/{getline; print $2; exit}' scripts/tools-versions-linux.yml)
          echo "python_version=$python_version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '${{ steps.pyv.outputs.python_version }}'

      - name: Prepare requirements (PyPI)
        run: |
          set -euo pipefail
          grep -v '^--' scripts/requirements-fixed.txt \
            | grep -vE '^matter-idl==' \
            > /tmp/requirements-pypi.txt
          echo "Pins to check: $(grep -c '==' /tmp/requirements-pypi.txt || true)"

      - name: Verify pins exist on PyPI (sdist or wheel)
        run: |
          set -euo pipefail
          pip_version=$(awk '/^pip:/{getline; print $2; exit}' scripts/tools-versions-linux.yml)
          python -m pip install "pip==${pip_version}"
          python3 <<'PY'
          import re
          import sys
          import urllib.error
          import urllib.request

          failures = []
          checked = 0
          with open("/tmp/requirements-pypi.txt", encoding="utf-8") as f:
              for lineno, raw in enumerate(f, 1):
                  line = raw.strip()
                  if not line or line.startswith("#"):
                      continue
                  m = re.match(r"^([A-Za-z0-9_.-]+)==([^#\s;]+)", line)
                  if not m:
                      failures.append(f"line {lineno}: unparsed {line!r}")
                      continue
                  name, version = m.group(1), m.group(2)
                  url = f"https://pypi.org/pypi/{name}/{version}/json"
                  try:
                      with urllib.request.urlopen(url, timeout=120) as resp:
                          if resp.status != 200:
                              failures.append(f"{name}=={version}: HTTP {resp.status}")
                              continue
                  except urllib.error.HTTPError as e:
                      failures.append(f"{name}=={version}: {e}")
                      continue
                  except OSError as e:
                      failures.append(f"{name}=={version}: {e}")
                      continue
                  checked += 1

          if failures:
              print("PyPI pin check failed:", file=sys.stderr)
              for msg in failures:
                  print(msg, file=sys.stderr)
              sys.exit(1)
          print(f"OK: {checked} pins found on PyPI")
          PY
