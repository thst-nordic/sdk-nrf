# Validates committed scripts/requirements-fixed.txt (no pip-compile regen).
name: Validate pip requirements-fixed.txt

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - 'v*-branch'
    paths:
      - 'scripts/requirements-fixed.txt'
      - 'scripts/requirements*.txt'
      - 'scripts/pip-audit-whitelist.yml'
      - 'scripts/pip/**'
      - '.github/workflows/validate-pip-requirements-fixed-file.yml'

permissions:
  contents: read

env:
  INDEX_URL: https://files.nordicsemi.com/artifactory/api/pypi/nordic-pypi/simple
  REQUIREMENTS_FIXED: scripts/requirements-fixed.txt
  RESULTS_DIR: results

jobs:
  pip-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Get python version
        id: pyv
        run: |
          sudo snap install --channel=v4 yq
          echo "python_version=$(yq '.python.version' scripts/tools-versions-linux.yml)" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '${{ steps.pyv.outputs.python_version }}'
      - name: Install pip-audit
        run: pip install pip-audit pyyaml
      - name: Run pip-audit
        working-directory: scripts/pip
        env:
          REQUIREMENTS_FIXED: ../requirements-fixed.txt
        run: python3 validate_requirements_fixed.py audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit
          path: scripts/pip/results/
          retention-days: 1

  consistency:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run consistency
        working-directory: scripts/pip
        env:
          REQUIREMENTS_FIXED: ../requirements-fixed.txt
        run: python3 validate_requirements_fixed.py consistency
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consistency
          path: scripts/pip/results/
          retention-days: 1

  resolve-nordic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '3.12'
      - name: Install packaging
        run: pip install packaging
      - name: Resolve (Nordic metadata)
        working-directory: scripts/pip
        env:
          REQUIREMENTS_FIXED: ../requirements-fixed.txt
        run: python3 validate_requirements_fixed.py resolve --index nordic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resolve-nordic
          path: scripts/pip/results/
          retention-days: 1

  resolve-pypi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '3.12'
      - name: Install packaging
        run: pip install packaging
      - name: Resolve (PyPI metadata)
        working-directory: scripts/pip
        env:
          REQUIREMENTS_FIXED: ../requirements-fixed.txt
        run: python3 validate_requirements_fixed.py resolve --index pypi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resolve-pypi
          path: scripts/pip/results/
          retention-days: 1

  wheels-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Wheels linux
        working-directory: scripts/pip
        env:
          CHECK_INDEX_PYTHON_TAG: cp312
          REQUIREMENTS_FIXED: ../requirements-fixed.txt
        run: python3 validate_requirements_fixed.py wheels --os linux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wheels-linux
          path: scripts/pip/results/
          retention-days: 1

  wheels-windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Wheels windows
        working-directory: scripts/pip
        env:
          CHECK_INDEX_PYTHON_TAG: cp312
          REQUIREMENTS_FIXED: ../requirements-fixed.txt
        run: python3 validate_requirements_fixed.py wheels --os windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wheels-windows
          path: scripts/pip/results/
          retention-days: 1

  wheels-mac-arm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Wheels mac_arm
        working-directory: scripts/pip
        env:
          CHECK_INDEX_PYTHON_TAG: cp312
          REQUIREMENTS_FIXED: ../requirements-fixed.txt
        run: python3 validate_requirements_fixed.py wheels --os mac_arm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wheels-mac-arm
          path: scripts/pip/results/
          retention-days: 1

  summary:
    runs-on: ubuntu-24.04
    needs:
      - pip-audit
      - consistency
      - resolve-nordic
      - resolve-pypi
      - wheels-linux
      - wheels-windows
      - wheels-mac-arm
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Write summary
        working-directory: scripts/pip
        env:
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: |
          python3 validate_requirements_fixed.py summary ../../artifacts \
            pip-audit=${{ needs.pip-audit.result }} \
            consistency=${{ needs.consistency.result }} \
            resolve-nordic=${{ needs.resolve-nordic.result }} \
            resolve-pypi=${{ needs.resolve-pypi.result }} \
            wheels-linux=${{ needs.wheels-linux.result }} \
            wheels-windows=${{ needs.wheels-windows.result }} \
            wheels-mac-arm=${{ needs.wheels-mac-arm.result }}
      - name: Fail if any check failed
        if: |
          needs.pip-audit.result != 'success' ||
          needs.consistency.result != 'success' ||
          needs.resolve-nordic.result != 'success' ||
          needs.resolve-pypi.result != 'success' ||
          needs.wheels-linux.result != 'success' ||
          needs.wheels-windows.result != 'success' ||
          needs.wheels-mac-arm.result != 'success'
        run: exit 1
